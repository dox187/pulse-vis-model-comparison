[package]
name = "pulse-vis"
version = "0.1.0"
edition = "2024"
description = "A configurable PulseAudio and PipeWire terminal audio visualizer"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
